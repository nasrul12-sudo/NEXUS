[project]
name = "nexus"
version = "0.1.0"
description = "Multimodal Spatial AI Human-Computer Interface"
requires-python = ">=3.11"
authors = [{name = "NEXUS"}]
readme = "README.md"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "pyzmq>=26.0",
    "redis>=5.0",
    "psutil>=5.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.9",
    "mediapipe>=0.10",
]
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "webrtcvad>=2.0.10",
    "piper-tts>=1.2",
]
brain = [
    "ollama>=0.3",
    "httpx>=0.27",
]
action = [
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
nexus-cli = "nexus.cli.main:main"